[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wilcoatc"
version = "0.1.0"
description = "Offline MSFS 2020/2024 ATC program"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-q"]
pythonpath = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

[tool.pytest.log_cli]
level = "WARNING"

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "UP"]
